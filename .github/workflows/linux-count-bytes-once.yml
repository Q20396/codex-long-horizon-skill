name: Count bytes once - explicitly approved first push

# Preparation only. A future signed commit and first push need separate approval.
# A new branch-only workflow is not assumed dispatchable from workflow_dispatch.
on:
  push:
    branches: [codex/linux-count-bytes-once-20261101]

permissions:
  contents: read

jobs:
  count-bytes-once:
    if: >-
      github.repository == 'Q20396/codex-long-horizon-skill' &&
      github.event.repository.private == false &&
      github.event.created == true &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.event.head_commit.message == 'COUNT_BYTES_ONCE_APPROVED_20261101' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXECUTION_SHA: ${{ github.sha }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Checkout exact execution commit without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Qualify fixed runtime then run at most three owned cases once
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -S -B - <<'PY'
          import hashlib, importlib.util, json, os, pathlib, platform, signal, stat, subprocess, sys, tempfile, time
          ROOT = pathlib.Path.cwd()
          BASE = '8a051239c834ee918a997ca9b1acc3c82b25e93b'
          BRANCH = 'refs/heads/codex/linux-count-bytes-once-20261101'
          WORKFLOW = '.github/workflows/linux-count-bytes-once.yml'
          EXPECTED = {
              'scripts/linux_task_file_observer.py': '414605dc54071f1cae5884c90634e647f53619174240829fcb269be0193b59a4',
              'tests/test_linux_task_file_observer.py': 'cdf77d7e2c307c956bb6aa90bf09331e02612ac6ffed69c80eae1acc600c3f3a',
              'docs/linux-task-file-observer.md': '52f5359f881de9e5b51f89b6dae05e316831e97c9e780a4129c045f1687a5694',
              'scripts/show_linux_owned_report.py': '5fd9ca0d84152485e94136ad893569adbb63602e06f59bd6ed8b7629a4f59fc7',
              'tests/test_show_linux_owned_report.py': 'b6fc1a74af6d898b088ad368c8cbbdceef11f39c8a799c62f1165c1842e9f2d2',
          }
          RUNTIME = {
              '/usr/bin/wc': '/usr/bin/wc',
              '/etc/ld.so.cache': '/etc/ld.so.cache',
              '/lib64/ld-linux-x86-64.so.2': '/usr/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2',
              '/lib/x86_64-linux-gnu/libc.so.6': '/usr/lib/x86_64-linux-gnu/libc.so.6',
          }
          # Requirements, not claims about an unobserved runner. No discovery or installs.
          REQUIREMENTS = {'os': 'Ubuntu 24.04', 'architecture': 'x86_64',
              'python': '3.12.3', 'wc': 'wc (GNU coreutils) 9.4',
              'git': 'git version 2.', 'bash': 'GNU bash version 5.x', 'runtime_origin': 'preinstalled Ubuntu runner system packages',
              'runtime_trust': 'same-run cooperative host qualification; not official binary provenance',
              'observer_seconds': 8, 'case_software_seconds': 30,
              'all_cases_and_closeout_software_seconds': 120}
          started = time.monotonic()
          deadline = started + 120
          packet = {'status': 'NOT_PASS', 'source': 'COUNT_BYTES_ONCE_CI_V1',
              'base': BASE, 'execution_sha': os.environ['EXECUTION_SHA'],
              'run_id': os.environ['RUN_ID'], 'attempt': os.environ['RUN_ATTEMPT'],
              'requirements': REQUIREMENTS, 'cases': [], 'native_state': 'NOT_ATTEMPTED',
              'write_tail': 'UNKNOWN', 'evidence_complete': False}
          STOP_CODES = ('BASH_VERSION', 'BASE_PARENT', 'CASE_NOT_PASS', 'CASE_SOFTWARE_DEADLINE', 'CONTROL_COMMAND_FAILED', 'CONTROL_OUTPUT_CAP', 'DISPATCH_IDENTITY', 'EXACT_SIX_FILE_DIFF', 'EXECUTION_SHA', 'FIVE_FILE_BINDING', 'FIXED_ALIAS_LAYOUT', 'GIT_VERSION', 'INHERITED_OBSERVER', 'INPUT_SHORT_WRITE', 'LINUX_UNPRIVILEGED_X64', 'NEGATIVE_NOT_REJECTED', 'NEGATIVE_REASON', 'OWNERSHIP_APIS', 'PRELOAD_PRESENT', 'PYTHON_VERSION', 'REPORT_CAP', 'REPORT_READBACK_DIFFERENT', 'RUNTIME_ALIAS_CHANGED', 'RUNTIME_HASH_CAP', 'RUNTIME_IDENTITY_CHANGED', 'RUNTIME_MANIFEST_CAP', 'RUNTIME_SHORT_READ', 'RUNTIME_SHORT_WRITE', 'RUNTIME_TYPE_OWNER_MODE', 'SECCOMP_POLICY', 'TOTAL_SOFTWARE_DEADLINE', 'UBUNTU_VERSION', 'WC_VERSION', 'YAMA_POLICY')
          hashed_bytes = 0
          def need(ok, code):
              if not ok: raise RuntimeError(code)
          def budget(reserve=0):
              need(time.monotonic() + reserve < deadline, 'TOTAL_SOFTWARE_DEADLINE')
          def stable(a, b):
              return all(getattr(a, k) == getattr(b, k) for k in
                  ('st_dev','st_ino','st_size','st_mtime_ns','st_ctime_ns','st_mode','st_uid'))
          def pinned(path, canonical):
              global hashed_bytes
              budget(5)
              before_link = os.lstat(path)
              link = os.readlink(path) if stat.S_ISLNK(before_link.st_mode) else None
              need(os.path.realpath(path) == canonical and os.path.realpath(canonical) == canonical,
                   'FIXED_ALIAS_LAYOUT')
              fd = os.open(canonical, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              try:
                  a = os.fstat(fd)
                  need(stat.S_ISREG(a.st_mode) and a.st_uid == 0 and not a.st_mode & 0o022,
                       'RUNTIME_TYPE_OWNER_MODE')
                  need(0 < a.st_size <= 32*1024*1024 - hashed_bytes, 'RUNTIME_HASH_CAP')
                  digest = hashlib.sha256(); left = a.st_size
                  while left:
                      budget(5)
                      block = os.read(fd, min(left, 65536))
                      need(bool(block), 'RUNTIME_SHORT_READ')
                      hashed_bytes += len(block); left -= len(block); digest.update(block)
                  need(stable(a, os.fstat(fd)), 'RUNTIME_IDENTITY_CHANGED')
              finally:
                  os.close(fd)
              need(stable(before_link, os.lstat(path)) and os.path.realpath(path) == canonical
                   and stable(a, os.lstat(canonical)),
                   'RUNTIME_ALIAS_CHANGED')
              return {'path': path, 'resolved_path': canonical, 'device': a.st_dev,
                  'inode': a.st_ino, 'size': a.st_size, 'sha256': digest.hexdigest(),
                  'alias_link': link, 'mtime_ns': a.st_mtime_ns, 'ctime_ns': a.st_ctime_ns}
          def command(argv, cap=2048):
              budget(5)
              r = subprocess.run(argv, capture_output=True, timeout=min(5, deadline-time.monotonic()-5),
                  env={'PATH':'/usr/bin:/bin','LC_ALL':'C','GIT_CONFIG_NOSYSTEM':'1'})
              need(len(r.stdout)+len(r.stderr) <= cap, 'CONTROL_OUTPUT_CAP')
              need(r.returncode == 0, 'CONTROL_COMMAND_FAILED')
              return r.stdout.decode('ascii', 'strict').strip()
          def load_module(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
              return module
          def run():
              need(os.environ.get('GITHUB_REPOSITORY') == 'Q20396/codex-long-horizon-skill'
                   and os.environ.get('GITHUB_REF') == BRANCH
                   and os.environ.get('GITHUB_EVENT_NAME') == 'push' and packet['attempt'] == '1',
                   'DISPATCH_IDENTITY')
              need(sys.platform == 'linux' and platform.machine() == 'x86_64' and os.geteuid() != 0,
                   'LINUX_UNPRIVILEGED_X64')
              need(sys.version_info[:3] == (3,12,3), 'PYTHON_VERSION')
              release = pathlib.Path('/etc/os-release').read_text()
              need('ID=ubuntu' in release.splitlines() and 'VERSION_ID="24.04"' in release.splitlines(),
                   'UBUNTU_VERSION')
              need(hasattr(os,'pidfd_open') and hasattr(signal,'pidfd_send_signal')
                   and signal.getsignal(signal.SIGCHLD) == signal.SIG_DFL, 'OWNERSHIP_APIS')
              need(pathlib.Path('/proc/sys/kernel/yama/ptrace_scope').read_text().strip() in ('0','1'),
                   'YAMA_POLICY')
              need([x.split(':',1)[1].strip() for x in pathlib.Path('/proc/self/status').read_text().splitlines()
                    if x.startswith('Seccomp:')] == ['0'], 'SECCOMP_POLICY')
              tools = [pinned('/usr/bin/python3', '/usr/bin/python3.12'), pinned('/usr/bin/git','/usr/bin/git'),
                  pinned('/usr/bin/bash','/usr/bin/bash')]
              packet['controller_tools'] = tools
              need(command(['/usr/bin/git','--version']).startswith('git version 2.'), 'GIT_VERSION')
              packet['git_version'] = command(['/usr/bin/git','--version'])
              packet['bash_version'] = command(['/usr/bin/bash','--version']).splitlines()[0]
              need(packet['bash_version'].startswith('GNU bash, version 5.'), 'BASH_VERSION')
              need(command(['/usr/bin/git','rev-parse','HEAD']) == packet['execution_sha'], 'EXECUTION_SHA')
              need(command(['/usr/bin/git','rev-parse','HEAD^']) == BASE, 'BASE_PARENT')
              need(set(command(['/usr/bin/git','diff','--name-only',BASE,'HEAD']).splitlines())
                   == set(EXPECTED) | {WORKFLOW}, 'EXACT_SIX_FILE_DIFF')
              for name, digest in EXPECTED.items():
                  need(hashlib.sha256((ROOT/name).read_bytes()).hexdigest() == digest, 'FIVE_FILE_BINDING')
              need(hashlib.sha256((ROOT/'scripts/linux_owned_file_observer.py').read_bytes()).hexdigest()
                   == '17f69cca50026f755f79c3e842f4a9af7f36e622b5a5aee93bf536f72a1dfa10', 'INHERITED_OBSERVER')
              packet['source_sha256'] = EXPECTED
              packet['workflow_sha256'] = hashlib.sha256((ROOT/WORKFLOW).read_bytes()).hexdigest()
              need(not os.path.lexists('/etc/ld.so.preload'), 'PRELOAD_PRESENT')
              rows = [pinned(p,c) for p,c in RUNTIME.items()]
              runtime = {'version':1,'executable':'/usr/bin/wc','objects':rows,
                  'absent_paths':['/etc/ld.so.preload']}
              packet['runtime_qualification'] = runtime
              packet['wc_version'] = command(['/usr/bin/wc','--version']).splitlines()[0]
              need(packet['wc_version'] == REQUIREMENTS['wc'], 'WC_VERSION')
              packet['environment'] = {'python':platform.python_version(),'kernel':platform.release(),
                  'architecture':platform.machine(),'uid':os.geteuid(),
                  'image_os':os.environ.get('ImageOS','UNKNOWN'),
                  'image_version':os.environ.get('ImageVersion','UNKNOWN'),
                  'mount_namespace':os.readlink('/proc/self/ns/mnt')}
              module = load_module('count_bytes_task', ROOT/'scripts/linux_task_file_observer.py')
              viewer = load_module('count_bytes_view', ROOT/'scripts/show_linux_owned_report.py')
              os.umask(0o077)
              fixtures = pathlib.Path(tempfile.mkdtemp(prefix='count-bytes-fixtures-', dir=ROOT/'examples'))
              runtime_path = fixtures/'runtime.json'
              raw = (json.dumps(runtime, separators=(',',':'))+'\n').encode()
              need(len(raw)<=8192, 'RUNTIME_MANIFEST_CAP')
              with runtime_path.open('xb') as f: need(f.write(raw)==len(raw), 'RUNTIME_SHORT_WRITE')
              packet['runtime_manifest_sha256'] = hashlib.sha256(raw).hexdigest()
              for case, data in [('ordinary',b'owned non-sensitive\nsecond line\n'),('empty',b'')]:
                  budget(35)
                  target = fixtures/case
                  with target.open('xb') as f: need(f.write(data)==len(data), 'INPUT_SHORT_WRITE')
                  case_started = time.monotonic()
                  packet['native_state'] = 'ENTRY_INVOKED_STATE_UNKNOWN'
                  result, report_path = module.run_task(str(fixtures),case,str(runtime_path),
                      'NEW_COUNT_BYTES_TASK_GRANTED',project=ROOT)
                  report_raw = report_path.read_bytes()
                  item = {'id':case,'elapsed_seconds':time.monotonic()-case_started,
                      'report_bytes':len(report_raw),'report_sha256':hashlib.sha256(report_raw).hexdigest()}
                  packet['cases'].append(item)
                  need(len(report_raw)<=32768, 'REPORT_CAP')
                  item['report'] = json.loads(report_raw)
                  need(item['report']==result, 'REPORT_READBACK_DIFFERENT')
                  viewer.render_task_report(result)
                  need(result['status']==module.STATUS and result['task_reported_bytes']==len(data)
                       and result['observed_read_bytes']==len(data), 'CASE_NOT_PASS')
                  need(item['elapsed_seconds']<=30, 'CASE_SOFTWARE_DEADLINE')
                  budget(5)
              budget(5)
              # Pure entry rejection: checked_leaf rejects before output directory/child creation.
              try:
                  module.run_task(str(fixtures),'../outside',str(runtime_path),
                      'NEW_COUNT_BYTES_TASK_GRANTED',project=ROOT)
              except module.Rejected as exc:
                  need(str(exc)=='INPUT_LEAF', 'NEGATIVE_REASON')
                  packet['cases'].append({'id':'prelaunch-reject','status':'EXPECTED_REJECT',
                      'reason':'INPUT_LEAF','child_created':False})
              else: raise RuntimeError('NEGATIVE_NOT_REJECTED')
              packet['native_state'] = 'TWO_TASKS_REAPED_THIRD_REJECTED_BEFORE_CHILD'
              budget(5)
              packet['status'] = 'PASS_SELECTED_THREE_CASES_WITH_LIMITS'
              packet['evidence_complete'] = True
          try:
              run()
          except BaseException as exc:
              packet['status'] = 'NOT_PASS'
              packet['stop_kind'] = type(exc).__name__
              # Local fixed controller errors contain codes only; no exception repr/traceback.
              packet['stop_code'] = str(exc) if type(exc) is RuntimeError and str(exc) in STOP_CODES else 'UNKNOWN'
          packet['elapsed_before_log'] = time.monotonic()-started
          if packet['elapsed_before_log']>=120:
              packet['status']='NOT_PASS';packet['stop_code']='TOTAL_SOFTWARE_DEADLINE'
          payload = json.dumps(packet,ensure_ascii=True,separators=(',',':')).encode()
          if len(payload)>65536:
              # Never trim a successful report into PASS; full evidence unavailable.
              payload = json.dumps({'status':'NOT_PASS','stop_code':'PACKET_CAP',
                  'evidence_complete':False,'unpublished_bytes':len(payload),
                  'execution_sha':packet['execution_sha'],'run_id':packet['run_id']},separators=(',',':')).encode()
              packet['status']='NOT_PASS'
          print('COUNT_BYTES_EVIDENCE_BYTES='+str(len(payload)))
          print('COUNT_BYTES_EVIDENCE_SHA256='+hashlib.sha256(payload).hexdigest())
          print(payload.decode('ascii'))
          print('COUNT_BYTES_EVIDENCE_END')
          # The final log call/transport tail remains UNKNOWN, not a hard 120s proof.
          raise SystemExit(0 if packet['status']=='PASS_SELECTED_THREE_CASES_WITH_LIMITS' else 1)
          PY
