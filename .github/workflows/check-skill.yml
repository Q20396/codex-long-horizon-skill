name: Check skill package

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-skill:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.x"

      - name: Validate package structure
        run: python3 .agents/skills/long-horizon-engineering/scripts/check_skill_package.py

      - name: Check helper command help
        run: |
          python3 .agents/skills/long-horizon-engineering/scripts/check_skill_package.py --help
          python3 .agents/skills/long-horizon-engineering/scripts/check_for_updates.py --help
          python3 .agents/skills/long-horizon-engineering/scripts/append_project_memory.py --help
          python3 .agents/skills/long-horizon-engineering/scripts/update_task_log.py --help
          python3 .agents/skills/long-horizon-engineering/scripts/github_skill_scan.py --help
          python3 .agents/skills/long-horizon-engineering/scripts/scan_top_related_skills.py --help
          python3 .agents/skills/long-horizon-engineering/scripts/doctor.py --help
          python3 .agents/skills/long-horizon-engineering/scripts/audit_skill_descriptions.py --help
          python3 .agents/skills/long-horizon-engineering/scripts/validate_json_canvas.py --help
          python3 .agents/skills/long-horizon-engineering/scripts/audit_external_skill_candidate.py --help
          python3 .agents/skills/long-horizon-engineering/scripts/audit_skill_safety.py --help
          python3 .agents/skills/long-horizon-engineering/scripts/manage_skill_lifecycle.py --help
          python3 .agents/skills/long-horizon-engineering/scripts/score_skill_candidate.py --help
          python3 .agents/skills/long-horizon-engineering/scripts/update_installed_skill.py --help
          python3 .agents/skills/long-horizon-engineering/scripts/test_expected_triggers.py --help
          python3 .agents/skills/ai-video-production/scripts/scan_top_media_skills.py --help
          python3 scripts/generate_skill_catalog.py --help
          python3 scripts/validate_plugin_package.py --help
          python3 scripts/test_fresh_install.py --help
          python3 scripts/check_release_readiness.py --help
          python3 scripts/assemble_skill_profile.py --help
          python3 scripts/verify_release_receipt.py --help
          python3 scripts/skill_update_selfcheck.py --help

      - name: Run productized package checks
        run: |
          python3 scripts/generate_skill_catalog.py --check
          python3 .agents/skills/long-horizon-engineering/scripts/doctor.py
          python3 .agents/skills/long-horizon-engineering/scripts/audit_skill_descriptions.py
          python3 .agents/skills/long-horizon-engineering/scripts/audit_skill_safety.py
          python3 .agents/skills/long-horizon-engineering/scripts/score_skill_candidate.py --fail-on-regression
          python3 .agents/skills/long-horizon-engineering/scripts/manage_skill_lifecycle.py list
          python3 .agents/skills/long-horizon-engineering/scripts/manage_skill_lifecycle.py suggest-freeze --include-never-used
          python3 .agents/skills/long-horizon-engineering/scripts/test_expected_triggers.py
          python3 .agents/skills/long-horizon-engineering/scripts/update_installed_skill.py --list-skills
          python3 -m unittest discover -s tests -p "test_*.py"
          python3 scripts/validate_plugin_package.py
          python3 scripts/test_fresh_install.py --skip-codex-cli
          python3 scripts/check_release_readiness.py \
            --version 0.4.1 \
            --release-state final \
            --allow-existing-tag
          python3 scripts/test_skill_update_selfcheck.py
          python3 scripts/test_assemble_skill_profile.py

      - name: Compile Python helper scripts
        run: |
          scripts_to_compile="
          .agents/skills/long-horizon-engineering/scripts/doctor.py
          .agents/skills/long-horizon-engineering/scripts/update_installed_skill.py
          .agents/skills/long-horizon-engineering/scripts/test_expected_triggers.py
          .agents/skills/long-horizon-engineering/scripts/check_skill_package.py
          .agents/skills/long-horizon-engineering/scripts/audit_skill_descriptions.py
          .agents/skills/long-horizon-engineering/scripts/validate_json_canvas.py
          .agents/skills/ai-video-production/scripts/scan_top_media_skills.py
          scripts/full_skill_validation.py
          scripts/generate_skill_catalog.py
          scripts/validate_plugin_package.py
          scripts/test_fresh_install.py
          scripts/check_release_readiness.py
          scripts/assemble_skill_profile.py
          scripts/verify_release_receipt.py
          scripts/skill_update_selfcheck.py
          scripts/test_skill_update_selfcheck.py
          scripts/test_assemble_skill_profile.py
          tests/test_release_tooling.py
          "
          if [ -f .agents/skills/long-horizon-engineering/scripts/audit_skill_optimization_readiness.py ]; then
            scripts_to_compile="$scripts_to_compile .agents/skills/long-horizon-engineering/scripts/audit_skill_optimization_readiness.py"
          fi
          if [ -f .agents/skills/long-horizon-engineering/scripts/enable_disaster_monitoring.py ]; then
            scripts_to_compile="$scripts_to_compile .agents/skills/long-horizon-engineering/scripts/enable_disaster_monitoring.py"
          fi
          PYTHONPYCACHEPREFIX=/tmp/codex-pycache python3 -m py_compile $scripts_to_compile

      - name: Check whitespace in diff
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            git diff --check HEAD~1...HEAD
          else
            git diff --check HEAD
          fi

      - name: Smoke test update dry-run
        run: |
          rm -rf /tmp/codex-skill-ci-dry-run
          mkdir -p /tmp/codex-skill-ci-dry-run
          python3 .agents/skills/long-horizon-engineering/scripts/update_installed_skill.py \
            --target-root /tmp/codex-skill-ci-dry-run \
            --skill long-horizon-engineering
          python3 .agents/skills/long-horizon-engineering/scripts/update_installed_skill.py \
            --target-root /tmp/codex-skill-ci-dry-run \
            --skill ai-video-production

  formal-schema-gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONNOUSERSITE: "1"
      PIP_NO_INPUT: "1"
      PIP_NO_CACHE_DIR: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      LHE_HISTORICAL_VALIDATION_MODE: release
      FORMAL_CANDIDATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: Check out candidate without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up approved Python matrix
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          architecture: "x64"

      - name: Record isolated runner identity
        run: |
          python3 --version
          python3 -m pip --version
          uname -a
          printf 'ImageOS=%s\nImageVersion=%s\n' "$ImageOS" "$ImageVersion"
          git rev-parse HEAD
          git show -s --format=%T HEAD

      - name: Validate lock and dependency-free fallback
        run: |
          python3 scripts/validate_formal_schemas.py --check-lock
          python3 -m unittest tests.test_formal_schema_validation -v

      - name: Install exact wheels in a temporary virtual environment
        run: |
          python3 -m venv "$RUNNER_TEMP/lhe-formal-schema-venv"
          "$RUNNER_TEMP/lhe-formal-schema-venv/bin/python" -m pip install \
            --isolated \
            --index-url https://pypi.org/simple \
            --only-binary=:all: \
            --require-hashes \
            --no-input \
            --no-cache-dir \
            --report "$RUNNER_TEMP/formal-schema-pip-report.json" \
            -r requirements-release.txt

      - name: Acquire official evidence once
        run: |
          python3 scripts/validate_formal_schemas.py \
            --verify-acquisition \
            --pip-report "$RUNNER_TEMP/formal-schema-pip-report.json" \
            --evidence-dir "$RUNNER_TEMP/formal-schema-evidence" \
            --result "$RUNNER_TEMP/formal-schema-evidence/acquisition-receipt.json" \
            --candidate-base "$FORMAL_CANDIDATE_BASE" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --job-name "$GITHUB_JOB"

      - name: Run formal Draft 2020-12 gate in routine post-tag-safe mode
        run: |
          "$RUNNER_TEMP/lhe-formal-schema-venv/bin/python" \
            -m unittest tests.test_formal_schema_validation -v
          "$RUNNER_TEMP/lhe-formal-schema-venv/bin/python" \
            scripts/check_release_readiness.py \
            --version 0.4.1 \
            --release-state final \
            --allow-existing-tag \
            --formal-schema-pip-report "$RUNNER_TEMP/formal-schema-pip-report.json" \
            --formal-schema-acquisition-result "$RUNNER_TEMP/formal-schema-evidence/acquisition-receipt.json" \
            --formal-schema-evidence-dir "$RUNNER_TEMP/formal-schema-evidence" \
            --formal-schema-candidate-base "$FORMAL_CANDIDATE_BASE" \
            --formal-schema-result "$RUNNER_TEMP/formal-schema-result.json"

      - name: Preserve formal release evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lhe-formal-schema-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/formal-schema-result.json
            ${{ runner.temp }}/formal-schema-pip-report.json
            ${{ runner.temp }}/formal-schema-evidence
          if-no-files-found: error
          retention-days: 7

      - name: Report checkout status paths after formal gate failure
        if: failure()
        run: |
          printf '%s\n' 'Formal schema gate failed; checkout status paths follow:'
          git status --porcelain=v1 --untracked-files=all || true
