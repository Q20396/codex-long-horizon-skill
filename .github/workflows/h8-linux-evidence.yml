name: H8 fixed SHA Linux evidence
on:
  push:
    branches:
      - h8-linux-evidence-214d710-20261029-once
permissions:
  contents: read
jobs:
  qualification:
    if: >-
      github.event.created == true &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout reviewed control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout frozen tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 214d7104dda1b27a5c9faf7c15ee06b7911176c8
          path: tested
          fetch-depth: 0
          persist-credentials: false
      - name: Exact Python without dependency installation or cache
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.15.1"
          architecture: x64
          check-latest: false
      - name: Noninterference check
        run: |
          echo "H8_PREP_DEADLINE=$(python3 -c 'import time; print(time.monotonic() + 120)')" >> "$GITHUB_ENV"
          timeout --signal=KILL 120 python3 -B control/scripts/h8_linux_evidence.py --self-test
      - name: One bounded qualification execution
        run: python3 -B control/scripts/h8_linux_evidence.py --run tested control
