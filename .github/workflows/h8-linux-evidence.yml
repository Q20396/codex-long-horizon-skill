name: H8 event stop selected evidence
on:
  push:
    branches:
      - h8-event-stop-repair-214d710-20261030-once
permissions:
  contents: read
jobs:
  qualification:
    if: >-
      github.event.repository.private == false &&
      github.event.created == true &&
      github.event.before == '0000000000000000000000000000000000000000' &&
      github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      H8_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - name: Checkout exact reviewed control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout frozen product
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 214d7104dda1b27a5c9faf7c15ee06b7911176c8
          path: tested
          fetch-depth: 0
          persist-credentials: false
      - name: Exact runtime no cache or dependency installation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15.1'
          architecture: x64
          check-latest: false
      - name: Single selected instrumented execution only after separate authority
        run: python3 -B control/scripts/h8_linux_evidence.py --run tested control
